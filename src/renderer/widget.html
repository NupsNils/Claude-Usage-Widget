<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <title>Claude Usage</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <div class="widget" id="widget">
      <header class="titlebar">
        <span class="title">Claude Usage</span>
        <div class="titlebar-actions">
          <button type="button" class="icon-button" id="refresh-button" title="Refresh now" aria-label="Refresh now">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89" />
              <path d="M13.5 2.5v3h-3" />
            </svg>
          </button>
          <button type="button" class="icon-button" id="settings-button" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2 4h6.25M11.75 4H14M2 8h1.25M6.75 8H14M2 12h7.25M12.75 12H14" />
              <circle cx="10" cy="4" r="1.75" />
              <circle cx="5" cy="8" r="1.75" />
              <circle cx="11" cy="12" r="1.75" />
            </svg>
          </button>
          <button type="button" class="icon-button" id="hide-button" title="Hide to tray" aria-label="Hide to tray">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8" />
            </svg>
          </button>
        </div>
      </header>
      <main class="accounts" id="accounts"></main>
      <section class="empty" id="empty" hidden>
        <p>No accounts added yet.</p>
        <button type="button" class="button primary" id="add-account-button">Add account</button>
      </section>
      <footer class="footer" id="footer"></footer>
    </div>
    <script src="widget.js"></script>
  </body>
</html>
